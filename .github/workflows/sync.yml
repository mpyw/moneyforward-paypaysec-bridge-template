name: sync

# 平日 JST 15:30 = UTC 06:30。月〜金 (cron は 0=Sun, 1-5=Mon-Fri)。
#
# 実績では GitHub の scheduler 遅延で 1〜3 時間ずれて発火する。大引け後という
# 要件は満たすが定刻ではない。
#
# 頻度を上げないこと。PayPay 証券も MoneyForward も、短時間に何度もログインすると
# OTP メールの送信自体を止める。
on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:
    inputs:
      allow-emptying-categories:
        description: '売却でカテゴリが丸ごと空になった場合のみ true。既定は空(=無効)'
        required: false
        default: ''

permissions:
  # チェックアウトすら要らないが、既定を絞る意味で明示しておく。OTP は Gmail API
  # から直接読むので、GitHub のトークンには一切触れない。
  contents: read

concurrency:
  # 同時 2 ジョブを走らせない。PayPay も MF も 1 アカウントの直列リソースで、
  # 2 本走ると互いの OTP メールを取り合う。
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # テンプレート本体では走らせない。secrets が無いので、毎平日 public に赤い
    # ✗ が付き、失敗通知が飛び続けるだけになる。fork ではこの条件が外れる。
    if: github.repository != 'mpyw/moneyforward-paypaysec-bridge-template'
    name: sync balances
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # actions/checkout は要らない。アクションは composite で、全ステップが
      # 自分の github.action_path に閉じている。
      #
      # ⚠ タグは動く。`@v3` は「v3 系の最新」を指すポインタで、アクション側の
      #   author がいつでも別のコミットに向け直せる。つまりこのジョブは、
      #   あなたの証券口座と MoneyForward の資格情報を渡して、他人が後から
      #   差し替えられるコードを実行している。
      #
      #   気になるなら SHA-1 で固定する。ref が動かなくなるので、コードが
      #   変わるのはあなたが書き換えたときだけになる:
      #
      #     uses: mpyw/moneyforward-paypaysec-bridge-action@<40 桁のコミット SHA>
      #
      #   SHA はここに書き写さず，そのつど引くこと。書いておくと，アクションが
      #   更新されても古い版を指し続ける——直っていないバグを含む版かもしれない:
      #     gh api repos/mpyw/moneyforward-paypaysec-bridge-action/git/ref/tags/v3 \
      #       --jq .object.sha
      #
      #   代償は、スクレイパである以上ある。PayPay 証券や MoneyForward が DOM を
      #   変えた日にセレクタの修正が自動では届かず、毎営業日失敗する。固定するなら
      #   Dependabot を有効にして、更新が PR で来るようにしておくこと:
      #   .github/dependabot.yml に package-ecosystem: github-actions
      - name: Sync
        uses: mpyw/moneyforward-paypaysec-bridge-action@v3
        with:
          paypaysec-username: ${{ secrets.PAYPAYSEC_USERNAME }}
          paypaysec-password: ${{ secrets.PAYPAYSEC_PASSWORD }}
          moneyforward-email: ${{ secrets.MONEYFORWARD_EMAIL }}
          moneyforward-password: ${{ secrets.MONEYFORWARD_PASSWORD }}
          moneyforward-asset-id: ${{ secrets.MONEYFORWARD_ASSET_ID }}
          # gmail.readonly の authorized_user JSON。
          # `mfpp debug gmail authorize` が作る。SETUP.md の C を参照。
          gmail-credentials: ${{ secrets.GMAIL_CREDENTIALS }}
          # 手動実行のときだけ渡る。cron では常に空 = 無効。
          #
          # カテゴリが丸ごと空になる読み取りは，このスクレイパの誤読が毎回とった形
          # なので既定で拒否する。本当に売り切ったときだけ，1 回この入力を付けて回す。
          allow-emptying-categories: ${{ inputs.allow-emptying-categories }}
